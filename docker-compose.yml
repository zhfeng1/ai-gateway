services:
  ai-gateway:
    build:
      context: .
      args:
        APP_COMMIT: ${APP_COMMIT:-unknown}
    container_name: ai-gateway
    restart: unless-stopped
    ports:
      - "20000:20000"
    environment:
      DATABASE_TYPE: ${DATABASE_TYPE:-sqlite}
      DATABASE_PATH: /data/ai_gateway.sqlite3
      DATABASE_URL: ${DATABASE_URL:-}
      NEW_API_LOG_DATABASE_URL: ${NEW_API_LOG_DATABASE_URL:-}
      NEW_API_LOG_TABLES: ${NEW_API_LOG_TABLES:-logs}
      NEW_API_LOG_QUERY_TIMEOUT_SECONDS: ${NEW_API_LOG_QUERY_TIMEOUT_SECONDS:-3}
      PERFORMANCE_LOG_ENABLED: ${PERFORMANCE_LOG_ENABLED:-1}
      PERFORMANCE_LOG_THRESHOLD_MS: ${PERFORMANCE_LOG_THRESHOLD_MS:-100}
      HTTP_MAX_CONNECTIONS: ${HTTP_MAX_CONNECTIONS:-500}
      HTTP_MAX_KEEPALIVE_CONNECTIONS: ${HTTP_MAX_KEEPALIVE_CONNECTIONS:-200}
      HTTP_KEEPALIVE_EXPIRY_SECONDS: ${HTTP_KEEPALIVE_EXPIRY_SECONDS:-30}
      DINGTALK_WEBHOOK_URL: ${DINGTALK_WEBHOOK_URL:-}
      DINGTALK_WEBHOOK_TIMEOUT_SECONDS: ${DINGTALK_WEBHOOK_TIMEOUT_SECONDS:-10}
      REQUEST_TIMEOUT_SECONDS: "600"
      MAX_CAPTURE_BYTES: "0"
    volumes:
      - ./data:/data
